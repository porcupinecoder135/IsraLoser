<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IsraMaster - Geography Game</title>
    
    <!-- Leaflet & Firebase SDKs -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f6f9; }
        #map { height: 60vh; width: 100%; }
        .container { padding: 15px; max-width: 900px; margin: 0 auto; }
        .btn { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin: 2px; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-secondary { background: #6c757d; }
        
        /* Modal & Views */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        
        /* Replay Control Bar */
        #replay-bar { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1500; align-items: center; gap: 10px; }
        
        .archive-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .profile-card { background: #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="container">
        <h2>IsraMaster</h2>
        <button class="btn" onclick="openMyArchive()">📁 My Archive (Past 7 Days)</button>
        <button class="btn btn-secondary" onclick="openLeaderboard()">🏆 Leaderboard & Profiles</button>
    </div>

    <!-- Replay Floating Control Bar -->
    <div id="replay-bar">
        <span id="replay-status" style="font-weight: bold; font-size: 14px;">Step 0/0</span>
        <button class="btn" id="btn-replay-pause" onclick="togglePauseReplay()">Pause</button>
        <button class="btn btn-secondary" onclick="restartReplay()">Restart</button>
        <button class="btn btn-danger" onclick="exitReplay()">Exit</button>
    </div>

    <!-- Modals -->
    <div id="archive-modal" class="modal">
        <div class="modal-content">
            <h3 id="archive-title">Game Archive</h3>
            <div id="archive-list">Loading games...</div>
            <br>
            <button class="btn btn-secondary" onclick="closeModal('archive-modal')">Close</button>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <h3>Player Profile</h3>
            <div id="profile-details" class="profile-card"></div>
            <h4>Recent Games (Past Week)</h4>
            <div id="profile-archive-list"></div>
            <br>
            <button class="btn btn-secondary" onclick="closeModal('profile-modal')">Close</button>
        </div>
    </div>

<script>
    // -------------------------------------------------------------
    // Firebase Setup
    // -------------------------------------------------------------
    const firebaseConfig = {
        databaseURL: "https://YOUR-FIREBASE-APP.firebaseio.com" // Replace with your URL
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Map & Marker state
    let map = L.map('map').setView([31.5, 34.75], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let activeMarkers = []; 
    let activePolylines = [];
    let replayTimer = null;
    let currentReplayData = null;
    let currentReplayIndex = 0;
    let isPaused = false;

    // Get or Create Local User Identifier
    let currentUserId = localStorage.getItem('userId');
    if (!currentUserId) {
        currentUserId = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('userId', currentUserId);
    }

    // -------------------------------------------------------------
    // 1. User ID Fixes & Historical Data Syncing
    // -------------------------------------------------------------
    async function propagateProfileUpdate(userId, name, location) {
        try {
            const snapshot = await db.ref('scores').orderByChild('userId').equalTo(userId).once('value');
            const updates = {};
            snapshot.forEach(child => {
                updates[`scores/${child.key}/name`] = name;
                updates[`scores/${child.key}/location`] = location;
            });
            updates[`users/${userId}`] = { name: name, location: location, updatedAt: Date.now() };
            await db.ref().update(updates);
        } catch (err) {
            console.error('Failed to sync profile update:', err);
        }
    }

    // -------------------------------------------------------------
    // 2. Clear Map Functionality
    // -------------------------------------------------------------
    function clearMapLayers() {
        activeMarkers.forEach(m => map.removeLayer(m));
        activePolylines.forEach(p => map.removeLayer(p));
        activeMarkers = [];
        activePolylines = [];
    }

    // -------------------------------------------------------------
    // 3. Archives & 7-Day Filter
    // -------------------------------------------------------------
    async function fetchUserGames(userId) {
        const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
        const snapshot = await db.ref('scores').orderByChild('userId').equalTo(userId).once('value');
        
        const games = [];
        snapshot.forEach(child => {
            const data = child.val();
            if (data.timestamp && data.timestamp >= sevenDaysAgo) {
                games.push({ id: child.key, ...data });
            }
        });
        return games.reverse(); // Newest first
    }

    async function openMyArchive() {
        document.getElementById('archive-title').innerText = "My Archive (Past 7 Days)";
        document.getElementById('archive-modal').style.display = 'flex';
        const listDiv = document.getElementById('archive-list');
        listDiv.innerHTML = "Loading...";

        const games = await fetchUserGames(currentUserId);
        renderGameList(games, listDiv);
    }

    function renderGameList(games, container) {
        if (games.length === 0) {
            container.innerHTML = "<p>No games found from the last week.</p>";
            return;
        }

        container.innerHTML = games.map(g => {
            const dateStr = new Date(g.timestamp).toLocaleDateString('he-IL', { weekday: 'short', hour: '2-digit', minute:'2-digit' });
            return `
                <div class="archive-item">
                    <div>
                        <strong>${g.targetName || 'Game'}</strong> - 
                        <span>${g.won ? '✅ Won (' + g.guesses.length + ' tries)' : '❌ Lost'}</span>
                        <br><small style="color:#666">${dateStr}</small>
                    </div>
                    <button class="btn" onclick="startReplay('${g.id}')">▶ Watch Replay</button>
                </div>
            `;
        }).join('');
    }

    // -------------------------------------------------------------
    // 4. Profile & Statistics View
    // -------------------------------------------------------------
    async function openUserProfile(userId) {
        document.getElementById('profile-modal').style.display = 'flex';
        const detailsDiv = document.getElementById('profile-details');
        const archiveDiv = document.getElementById('profile-archive-list');
        
        detailsDiv.innerHTML = "Loading stats...";
        archiveDiv.innerHTML = "Loading games...";

        // Fetch user metadata & all games for stats calculation
        const userSnap = await db.ref(`users/${userId}`).once('value');
        const scoresSnap = await db.ref('scores').orderByChild('userId').equalTo(userId).once('value');
        
        let totalGames = 0;
        let wins = 0;
        let totalGuesses = 0;
        const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
        const recentGames = [];

        scoresSnap.forEach(child => {
            const g = child.val();
            totalGames++;
            if (g.won) wins++;
            totalGuesses += (g.guesses ? g.guesses.length : 10);
            
            if (g.timestamp && g.timestamp >= sevenDaysAgo) {
                recentGames.push({ id: child.key, ...g });
            }
        });

        const userInfo = userSnap.val() || { name: 'Anonymous', location: 'Unknown' };
        const winRate = totalGames > 0 ? ((wins / totalGames) * 100).toFixed(1) : 0;
        const avgGuesses = totalGames > 0 ? (totalGuesses / totalGames).toFixed(1) : 0;

        detailsDiv.innerHTML = `
            <h3>${userInfo.name}</h3>
            <p>📍 Location: ${userInfo.location}</p>
            <p>📊 Total Games Played: <strong>${totalGames}</strong></p>
            <p>🏆 Win Rate: <strong>${winRate}%</strong></p>
            <p>🎯 Avg Guesses per Game: <strong>${avgGuesses}</strong></p>
        `;

        renderGameList(recentGames.reverse(), archiveDiv);
    }

    // -------------------------------------------------------------
    // 5. Step-by-Step Step Map Replay System
    // -------------------------------------------------------------
    async function startReplay(gameId) {
        const snap = await db.ref(`scores/${gameId}`).once('value');
        currentReplayData = snap.val();
        
        if (!currentReplayData || !currentReplayData.guesses) {
            alert("Replay data is unavailable for this match.");
            return;
        }

        // Close all modals
        closeModal('archive-modal');
        closeModal('profile-modal');

        // CRITICAL: Clear map markers completely before displaying the replay
        clearMapLayers();

        // Setup replay environment state
        currentReplayIndex = 0;
        isPaused = false;
        document.getElementById('btn-replay-pause').innerText = "Pause";
        document.getElementById('replay-bar').style.display = 'flex';

        playNextStep();
    }

    function playNextStep() {
        if (!currentReplayData || isPaused) return;

        const guesses = currentReplayData.guesses;
        if (currentReplayIndex >= guesses.length) {
            document.getElementById('replay-status').innerText = "Replay Completed";
            return;
        }

        const step = guesses[currentReplayIndex];
        currentReplayIndex++;

        // Render replay marker on map
        const marker = L.marker([step.lat, step.lng])
            .addTo(map)
            .bindPopup(`<b>Guess ${currentReplayIndex}:</b> ${step.name || ''}`)
            .openPopup();
        
        activeMarkers.push(marker);
        map.panTo([step.lat, step.lng]);

        document.getElementById('replay-status').innerText = `Step ${currentReplayIndex}/${guesses.length}`;

        // Schedule next guess with a 2.5 second delay
        replayTimer = setTimeout(playNextStep, 2500);
    }

    function togglePauseReplay() {
        isPaused = !isPaused;
        const btn = document.getElementById('btn-replay-pause');
        if (isPaused) {
            btn.innerText = "Resume";
            clearTimeout(replayTimer);
        } else {
            btn.innerText = "Pause";
            playNextStep();
        }
    }

    function restartReplay() {
        clearTimeout(replayTimer);
        clearMapLayers();
        currentReplayIndex = 0;
        isPaused = false;
        document.getElementById('btn-replay-pause').innerText = "Pause";
        playNextStep();
    }

    function exitReplay() {
        clearTimeout(replayTimer);
        clearMapLayers();
        currentReplayData = null;
        document.getElementById('replay-bar').style.display = 'none';
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }
</script>
</body>
</html>
