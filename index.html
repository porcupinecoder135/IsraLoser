<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משחק ניחוש ערים</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --arrow-scale: 1;
      --distance-font-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100vw;
      z-index: 1;
    }

    /* Top Left Control Box */
    .controls-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 280px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #3498db;
    }

    button {
      padding: 10px 15px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: #2980b9;
    }

    .score-board {
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Larger, Prominent Top Right Leaderboard */
    .leaderboard-container {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      width: 320px;
      border: 3px solid #f1c40f;
    }

    .leaderboard-title {
      font-size: 22px;
      font-weight: 800;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .leaderboard-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f8f9fa;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    .leaderboard-item:nth-child(1) { background: #fff3cd; color: #856404; font-size: 18px; }
    .leaderboard-item:nth-child(2) { background: #e2e3e5; color: #383d41; }
    .leaderboard-item:nth-child(3) { background: #ffe8d6; color: #721c24; }

    /* Dopamine / Rewarding Score Popup Animation */
    .dopamine-popup {
      position: absolute;
      font-weight: 900;
      font-size: 32px;
      color: #2ecc71;
      text-shadow: 0 0 10px rgba(46, 204, 113, 0.6), 2px 2px 4px rgba(0,0,0,0.3);
      pointer-events: none;
      z-index: 2000;
      animation: floatUpAndBurst 1.2s ease-out forwards;
    }

    @keyframes floatUpAndBurst {
      0% {
        opacity: 0;
        transform: scale(0.3) translateY(0);
      }
      30% {
        opacity: 1;
        transform: scale(1.4) translateY(-20px);
      }
      70% {
        opacity: 1;
        transform: scale(1) translateY(-40px);
      }
      100% {
        opacity: 0;
        transform: scale(0.8) translateY(-70px);
      }
    }

    /* Screen Overlay Celebration Flash */
    .celebration-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1500;
      border: 8px solid #2ecc71;
      opacity: 0;
      transition: opacity 0.1s ease-in-out;
    }

    .celebration-flash.active {
      opacity: 1;
    }

    /* Settings Panel */
    .settings-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: #34495e;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .settings-modal {
      display: none;
      position: absolute;
      bottom: 80px;
      right: 20px;
      z-index: 1001;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      width: 280px;
      flex-direction: column;
      gap: 15px;
    }

    .settings-modal.active {
      display: flex;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .setting-item label {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .setting-item input[type="range"] {
      width: 100%;
    }

    /* Dynamic Sizing Targets */
    .custom-arrow-icon {
      transform-origin: center;
      transition: transform 0.1s ease;
    }

    .distance-display-label {
      font-size: calc(14px * var(--distance-font-scale));
      font-weight: bold;
      background: rgba(255, 255, 255, 0.9);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #333;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="flashOverlay" class="celebration-flash"></div>

  <!-- Controls Panel -->
  <div class="controls-container">
    <div class="input-group">
      <input type="text" id="cityInput" placeholder="הכנס שם עיר..." autocomplete="off">
      <button onclick="submitGuess()">נחש</button>
    </div>
    <div class="score-board">
      <span>ניקוד:</span>
      <span id="scoreValue">0</span>
    </div>
  </div>

  <!-- Prominent Leaderboard -->
  <div class="leaderboard-container">
    <div class="leaderboard-title">🏆 טבלת מובילים</div>
    <ul class="leaderboard-list" id="leaderboardList">
      <li class="leaderboard-item"><span>1. שחקן 1</span><span>1,200</span></li>
      <li class="leaderboard-item"><span>2. שחקן 2</span><span>950</span></li>
      <li class="leaderboard-item"><span>3. שחקן 3</span><span>800</span></li>
      <li class="leaderboard-item"><span>4. אתה</span><span id="playerLeaderboardScore">0</span></li>
    </ul>
  </div>

  <!-- Settings Button & Modal -->
  <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
  <div class="settings-modal" id="settingsModal">
    <h3 style="margin-bottom: 5px;">הגדרות תצוגה</h3>
    
    <div class="setting-item">
      <label for="arrowSizeRange">גודל חץ: <span id="arrowSizeVal">1.0</span>x</label>
      <input type="range" id="arrowSizeRange" min="0.5" max="2.5" step="0.1" value="1.0">
    </div>

    <div class="setting-item">
      <label for="distanceSizeRange">גודל טקסט מרחק: <span id="distanceSizeVal">1.0</span>x</label>
      <input type="range" id="distanceSizeRange" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>
  </div>

  <script>
    // Database with alternate names / aliases
    const CITIES_DATABASE = [
      {
        names: ["תל אביב", "תל אביב יפו", "תל אביב-יפו"],
        canonicalName: "תל אביב יפו",
        lat: 32.0853,
        lng: 34.7818
      },
      {
        names: ["פרדס חנה", "פרדס חנה כרכור", "פרדס חנה-כרכור"],
        canonicalName: "פרדס חנה כרכור",
        lat: 32.4711,
        lng: 34.9723
      },
      {
        names: ["מודיעין", "מודיעין מכבים רעות", "מודיעין-מכבים-רעות"],
        canonicalName: "מודיעין מכבים רעות",
        lat: 31.8903,
        lng: 35.0104
      },
      {
        names: ["ירושלים"],
        canonicalName: "ירושלים",
        lat: 31.7683,
        lng: 35.2137
      },
      {
        names: ["חיפה"],
        canonicalName: "חיפה",
        lat: 32.7940,
        lng: 34.9896
      }
    ];

    let currentScore = 0;
    let arrowScale = parseFloat(localStorage.getItem('arrowScale')) || 1.0;
    let distanceFontScale = parseFloat(localStorage.getItem('distanceFontScale')) || 1.0;

    // Initialize Map
    const map = L.map('map').setView([31.5, 34.75], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Apply Settings on Load
    document.documentElement.style.setProperty('--arrow-scale', arrowScale);
    document.documentElement.style.setProperty('--distance-font-scale', distanceFontScale);

    document.getElementById('arrowSizeRange').value = arrowScale;
    document.getElementById('arrowSizeVal').innerText = arrowScale.toFixed(1);
    document.getElementById('distanceSizeRange').value = distanceFontScale;
    document.getElementById('distanceSizeVal').innerText = distanceFontScale.toFixed(1);

    // Normalize String Function
    function normalizeInput(str) {
      return str.trim().replace(/-/g, ' ').replace(/\s+/g, ' ');
    }

    // Match City Input
    function findCity(inputName) {
      const cleanInput = normalizeInput(inputName);
      return CITIES_DATABASE.find(city => 
        city.names.some(alias => normalizeInput(alias) === cleanInput)
      );
    }

    // Process Guess
    function submitGuess() {
      const inputEl = document.getElementById('cityInput');
      const guessedName = inputEl.value;
      const matchedCity = findCity(guessedName);

      if (matchedCity) {
        const addedPoints = 100;
        currentScore += addedPoints;
        
        // Update Score Elements
        document.getElementById('scoreValue').innerText = currentScore;
        document.getElementById('playerLeaderboardScore').innerText = currentScore;

        // Trigger Animations
        triggerDopamineEffects(addedPoints);

        // Add Marker to Map
        addMarker(matchedCity);

        inputEl.value = '';
      } else {
        alert('עיר לא נמצאה, נסה שוב.');
      }
    }

    // High-Dopamine Reward Visual Effects
    function triggerDopamineEffects(points) {
      // 1. Screen Border Flash
      const flash = document.getElementById('flashOverlay');
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 200);

      // 2. Animated Floating Score Popup
      const scoreBoard = document.querySelector('.score-board');
      const rect = scoreBoard.getBoundingClientRect();

      const popup = document.createElement('div');
      popup.className = 'dopamine-popup';
      popup.innerText = `+${points} 🎉`;
      popup.style.left = `${rect.left + 20}px`;
      popup.style.top = `${rect.top}px`;

      document.body.appendChild(popup);

      setTimeout(() => popup.remove(), 1200);
    }

    // Add Marker & Custom Scaled Labels
    function addMarker(city) {
      const arrowIcon = L.divIcon({
        className: 'custom-arrow-icon',
        html: `<div style="transform: scale(${arrowScale}); font-size: 24px;">📍</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 30]
      });

      L.marker([city.lat, city.lng], { icon: arrowIcon })
        .addTo(map)
        .bindPopup(`<div class="distance-display-label">${city.canonicalName}</div>`)
        .openPopup();

      map.panTo([city.lat, city.lng]);
    }

    // Settings Toggle & Event Handlers
    function toggleSettings() {
      const modal = document.getElementById('settingsModal');
      modal.classList.toggle('active');
    }

    document.getElementById('arrowSizeRange').addEventListener('input', (e) => {
      arrowScale = parseFloat(e.target.value);
      document.getElementById('arrowSizeVal').innerText = arrowScale.toFixed(1);
      document.documentElement.style.setProperty('--arrow-scale', arrowScale);
      localStorage.setItem('arrowScale', arrowScale);
    });

    document.getElementById('distanceSizeRange').addEventListener('input', (e) => {
      distanceFontScale = parseFloat(e.target.value);
      document.getElementById('distanceSizeVal').innerText = distanceFontScale.toFixed(1);
      document.documentElement.style.setProperty('--distance-font-scale', distanceFontScale);
      localStorage.setItem('distanceFontScale', distanceFontScale);
    });

    // Enter Key Submission
    document.getElementById('cityInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') submitGuess();
    });
  </script>
</body>
</html>
